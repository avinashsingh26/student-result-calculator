<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hackathon</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">

        <h1>Student Result Calculator</h1>
        <br>
        <label  class="label" for="name">Name:</label>
        <input type="text" id="name" name="name"><br><br>

        <label  class="label" for="hindi">Hindi:</label>
        <input type="number" id="hindi" name="hindi"><br><br>

       <label  class="label" for="english">English:</label>
       <input type="number" id="english" name="english"><br><br>



       <label  class="label" for="maths">Maths:</label>
       <input type="number" id="maths" name="maths"><br><br>

       <label  class="label" for="science">Science:</label>
       <input type="number" id="science" name="science"><br><br>

       <label  class="label" for="computer">Computer:</label>
       <input type="number" id="computer" name="computer"><br><br>

       <button id="calculate">Calculate Result</button><br><br>
       <div id="result"></div>
    </div>


    <script src="script.js"></script>

</body>
</html>
