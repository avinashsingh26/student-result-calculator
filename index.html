<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Student Result Calculator</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="container">
    <h1>Student Result Calculator</h1>

    <form id="resultForm">
      <label for="studentName">Student Name</label>
      <input type="text" id="studentName" placeholder="Enter name" required />

      <label for="subject1">Subject 1 Marks</label>
      <input type="number" id="subject1" min="0" max="100" required />

      <label for="subject2">Subject 2 Marks</label>
      <input type="number" id="subject2" min="0" max="100" required />

      <label for="subject3">Subject 3 Marks</label>
      <input type="number" id="subject3" min="0" max="100" required />

      <button type="submit">Calculate Result</button>
    </form>

    <section id="result" class="result" aria-live="polite"></section>
  </main>

  <script src="script.js"></script>
</body>
</html>
